<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>La Bici — Talleres, Bicicleterías y más en CABA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --asfalto: #171A1A;
    --verde-ciclovia: #0E8C4D;
    --amarillo-alta-vis: #D6FF3F;
    --blanco-linea: #F5F2EA;
    --oxido: #C1440E;
    --gris-cemento: #8A8F87;
    --cielo-porteno: #3E7CB1;

    /* colores por categoría, como las líneas de subte: cada una con su color propio */
    --cat-taller: var(--verde-ciclovia);
    --cat-bicicleteria: var(--amarillo-alta-vis);
    --cat-alquiler: var(--cielo-porteno);
    --cat-indumentaria: var(--oxido);
    --cat-repuestos: #5B5F58;

    --font-display: 'Oswald', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    font-family: var(--font-body);
    background: var(--asfalto);
    overscroll-behavior: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    position: relative;
    overflow: hidden;
  }

  /* ---------- HEADER ---------- */
  header {
    background: var(--asfalto);
    color: var(--blanco-linea);
    padding: 14px 18px 12px;
    z-index: 30;
    flex-shrink: 0;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 12px;
  }

  .logo-mark {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
  }

  .logo-row h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 21px;
    letter-spacing: 0.2px;
  }

  .logo-row .ciudad {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 12px;
    color: var(--gris-cemento);
    margin-left: 2px;
    padding-top: 3px;
  }

  /* ---------- CHIPS DE FILTRO ---------- */
  #chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  #chips::-webkit-scrollbar { display: none; }

  .chip {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1.5px solid #3A3D3C;
    color: var(--blanco-linea);
    border-radius: 20px;
    padding: 7px 14px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }

  .chip .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .chip.active {
    background: var(--chip-color, var(--verde-ciclovia));
    border-color: var(--chip-color, var(--verde-ciclovia));
    color: var(--chip-text, var(--asfalto));
  }
  .chip.active .dot { display: none; }

  /* ---------- CHIPS-ÍCONO (fila compacta de categorías) ---------- */
  .chip-icon {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: transparent;
    border: none;
    color: #B8BDB5;
    padding: 6px 4px 0;
    cursor: pointer;
    min-width: 52px;
  }
  .chip-icon svg { transition: transform 0.15s; }
  .chip-icon span {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 10px;
  }
  .chip-icon.active {
    color: var(--chip-color, var(--verde-ciclovia));
  }
  .chip-icon.active svg { transform: scale(1.12); }

  /* ---------- MAPA ---------- */
  #map-container {
    flex: 1;
    position: relative;
    min-height: 0;
  }
  #map { width: 100%; height: 100%; }

  #status-pill {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(23, 26, 26, 0.92);
    color: var(--blanco-linea);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 20px;
    z-index: 10;
    white-space: nowrap;
  }

  #floating-controls {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: flex-end;
  }

  .floating-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--asfalto);
    color: var(--blanco-linea);
    border: 1.5px solid var(--chip-off-border, #3A3D3C);
    border-radius: 20px;
    padding: 8px 14px;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  .floating-toggle .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; opacity: 0.55; }
  .floating-toggle.on { border-color: transparent; }
  .floating-toggle.on .dot { opacity: 1; }

  #chip-domingo { --chip-off-border: #6b6420; }
  #chip-domingo.on { background: var(--amarillo-alta-vis); color: var(--asfalto); }

  #toggle-bicisendas { --chip-off-border: #1e5c3a; }
  #toggle-bicisendas.on { background: #2ECC71; color: var(--asfalto); }

  .btn-ir {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--verde-ciclovia);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn-ir:active { background: #0a6b3a; }

  /* ---------- BOTTOM SHEET ---------- */
  #sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--blanco-linea);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.25);
    z-index: 20;
    display: flex;
    flex-direction: column;
    height: 85vh;
    height: 85dvh;
    transform: translateY(calc(100% - 96px));
    transition: transform 0.25s cubic-bezier(.2,.8,.3,1);
    touch-action: none;
  }
  #sheet.expanded { transform: translateY(0); }
  #sheet.dragging { transition: none; }

  #sheet-handle-area {
    flex-shrink: 0;
    padding: 10px 18px 6px;
    cursor: grab;
  }

  .handle-bar {
    width: 40px;
    height: 4px;
    background: #D8D4C8;
    border-radius: 3px;
    margin: 0 auto 12px;
  }

  #sheet-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    color: var(--asfalto);
  }
  #sheet-title span { color: var(--gris-cemento); font-family: var(--font-body); font-weight: 500; }

  #sheet-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 14px 24px;
    -webkit-overflow-scrolling: touch;
  }

  .local-card {
    display: flex;
    gap: 12px;
    padding: 13px 8px;
    border-bottom: 1px solid #E8E4D8;
    cursor: pointer;
  }
  .local-card:active { background: #EFEBDD; }
  .local-card:last-child { border-bottom: none; }

  .local-card .marca {
    width: 5px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .local-card .info { flex: 1; min-width: 0; }

  .local-card h3 {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 15px;
    color: var(--asfalto);
    margin-bottom: 4px;
  }

  .cat-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 5px;
  }
  .cat-tag {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .local-card .direccion {
    font-size: 12.5px;
    color: var(--gris-cemento);
    margin-bottom: 3px;
  }

  .badge-domingo {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    padding: 2px 0;
  }
  .badge-domingo.si { color: var(--verde-ciclovia); }
  .badge-domingo.no { color: var(--oxido); }

  /* ---------- INFO WINDOW (Google) ---------- */
  .iw {
    font-family: var(--font-body);
    max-width: 230px;
  }
  .iw h3 {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    color: var(--asfalto);
    margin-bottom: 6px;
  }
  .iw .cat-tags { margin-bottom: 6px; }
  .iw p { font-size: 13px; margin: 3px 0; color: #333; }
  .iw a { color: var(--cielo-porteno); text-decoration: none; font-weight: 600; }

  @media (min-width: 720px) {
    #sheet { width: 380px; left: 16px; right: auto; bottom: 16px; border-radius: 16px; height: 70vh; }
    #sheet:not(.expanded) { transform: translateY(calc(100% - 110px)); }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="logo-row">
      <svg class="logo-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="34" r="8" stroke="var(--amarillo-alta-vis)" stroke-width="3.2"/>
        <circle cx="36" cy="34" r="8" stroke="var(--amarillo-alta-vis)" stroke-width="3.2"/>
        <path d="M12 34 L22 16 H30 M22 16 L30 34 M22 16 L16 26 H30 L36 34" stroke="var(--verde-ciclovia)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="30" cy="12" r="3.4" fill="var(--amarillo-alta-vis)"/>
      </svg>
      <h1>La Bici</h1>
      <span class="ciudad">CABA</span>
    </div>
    <div id="chips">
      <button class="chip-icon active" data-cat="todas" style="--chip-color: var(--blanco-linea); --chip-text: var(--asfalto);" aria-label="Todas">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="18" cy="18" r="3" fill="currentColor"/><path d="M6 18 L11 6 H15 M11 6 L15 18 M11 6 L8 14 H15 L18 18" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Todas</span>
      </button>
      <button class="chip-icon" data-cat="Taller" style="--chip-color: var(--cat-taller); --chip-text: white;" aria-label="Talleres">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M14.7 6.3a4 4 0 0 0-5.4 4.6L3 17.2V21h3.8l6.3-6.3a4 4 0 0 0 4.6-5.4l-2.6 2.6-2-2 2.6-2.6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>Taller</span>
      </button>
      <button class="chip-icon" data-cat="Bicicletería" style="--chip-color: var(--cat-bicicleteria); --chip-text: var(--asfalto);" aria-label="Bicicleterías">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="6" cy="17" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="17" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 17 L10 8 H14 M10 8 L14 17 M10 8 L7.5 13.5 H14.5 L18 17" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Bicis</span>
      </button>
      <button class="chip-icon" data-cat="Alquiler" style="--chip-color: var(--cat-alquiler); --chip-text: white;" aria-label="Alquiler">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 11a3 3 0 1 1 3.6-2.9L18 13.5V16h-2v2h-2v2h-3v-2.6l-2.6-2.6A3 3 0 0 1 9 11z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>Alquiler</span>
      </button>
      <button class="chip-icon" data-cat="Indumentaria" style="--chip-color: var(--cat-indumentaria); --chip-text: white;" aria-label="Indumentaria">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 4 L12 6.5 L15 4 L19 7 L17 10 L15.5 9 V20 H8.5 V9 L7 10 L5 7 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span>Ropa</span>
      </button>
      <button class="chip-icon" data-cat="Repuestos y accesorios" style="--chip-color: var(--cat-repuestos); --chip-text: white;" aria-label="Repuestos y accesorios">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Repuestos</span>
      </button>
    </div>
  </header>

  <div id="map-container">
    <div id="status-pill">Cargando locales…</div>
    <div id="floating-controls">
      <button id="chip-domingo" class="floating-toggle" type="button">
        <span class="dot" style="background:var(--amarillo-alta-vis);"></span>Abre domingo
      </button>
      <button id="toggle-bicisendas" class="floating-toggle" type="button">
        <span class="dot" style="background:#2ECC71;"></span>Bicisendas
      </button>
    </div>
    <div id="map"></div>
  </div>

  <div id="sheet">
    <div id="sheet-handle-area">
      <div class="handle-bar"></div>
      <div id="sheet-title">Locales <span id="sheet-count"></span></div>
    </div>
    <div id="sheet-list"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // ---------- CONFIGURACIÓN ----------
  const SUPABASE_URL = "https://hcgnlejfyhyrxumusjri.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjZ25sZWpmeWh5cnh1bXVzanJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MDA1MjcsImV4cCI6MjEwMzA3NjUyN30.m4axSVDjobVdbE5clPBSgslo4l0yEjOR64O-guSuZ04";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const CATEGORY_COLORS = {
    "Taller": "#0E8C4D",
    "Bicicletería": "#D6FF3F",
    "Alquiler": "#3E7CB1",
    "Indumentaria": "#C1440E",
    "Repuestos y accesorios": "#5B5F58"
  };
  const CATEGORY_TEXT = {
    "Taller": "#FFFFFF",
    "Bicicletería": "#171A1A",
    "Alquiler": "#FFFFFF",
    "Indumentaria": "#FFFFFF",
    "Repuestos y accesorios": "#FFFFFF"
  };

  // Estilo de mapa tono "asfalto" para que combine con el resto de la app
  // Mapa estándar de Google (sin estilo custom) — prioriza legibilidad de calles
  const MAP_STYLE = [];

  // ---------- IR EN BICI (usa el GPS del usuario) ----------
  window.abrirRuta = function (lat, lng) {
    const destino = `${lat},${lng}`;

    function abrirConOrigen(origen) {
      const base = "https://www.google.com/maps/dir/?api=1";
      const url = origen
        ? `${base}&origin=${origen}&destination=${destino}&travelmode=bicycling`
        : `${base}&destination=${destino}&travelmode=bicycling`;
      window.open(url, "_blank");
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => abrirConOrigen(`${pos.coords.latitude},${pos.coords.longitude}`),
        () => abrirConOrigen(null), // si no da permiso, Google Maps usa la ubicación del dispositivo igual
        { timeout: 6000 }
      );
    } else {
      abrirConOrigen(null);
    }
  };

  let map;
  let markers = [];
  let allLocales = [];
  let activeCategory = "todas";
  let onlySunday = false;
  let sharedInfoWindow = null; // una sola ventana de info compartida entre todos los pines

  function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
      center: { lat: -34.6037, lng: -58.4206 },
      zoom: 12,
      styles: MAP_STYLE,
      disableDefaultUI: true,
      zoomControl: true,
      gestureHandling: "greedy"
    });
    sharedInfoWindow = new google.maps.InfoWindow();
    cargarLocales();
    setupSheetDrag();

    // Capa nativa de Google con bicisendas y ciclovías — apagada por defecto,
    // el usuario la prende con el botón flotante si la quiere ver
    const bikeLayer = new google.maps.BicyclingLayer();
    const toggleBtn = document.getElementById("toggle-bicisendas");
    let bicisendasOn = false;

    toggleBtn.addEventListener("click", () => {
      bicisendasOn = !bicisendasOn;
      bikeLayer.setMap(bicisendasOn ? map : null);
      toggleBtn.classList.toggle("on", bicisendasOn);
    });
  }

  async function cargarLocales() {
    const status = document.getElementById("status-pill");
    const { data, error } = await supabaseClient
      .from("locales")
      .select(`*, locales_categorias ( categorias ( nombre ) )`);

    if (error) {
      status.textContent = "❌ Error: " + error.message;
      console.error(error);
      return;
    }

    allLocales = data.map(local => ({
      ...local,
      categorias: (local.locales_categorias || []).map(lc => lc.categorias.nombre)
    }));

    render();
  }

  function filtrar() {
    return allLocales.filter(local => {
      const pasaCategoria = activeCategory === "todas" || local.categorias.includes(activeCategory);
      const pasaDomingo = !onlySunday || local.abre_domingo === true;
      return pasaCategoria && pasaDomingo;
    });
  }

  function render() {
    const filtrados = filtrar();
    renderMarkers(filtrados);
    renderSheetList(filtrados);
    document.getElementById("status-pill").textContent = `${filtrados.length} de ${allLocales.length} locales`;
    document.getElementById("sheet-count").textContent = `(${filtrados.length})`;
  }

  function colorPrincipal(categorias) {
    const principal = categorias && categorias.length > 0 ? categorias[0] : null;
    return CATEGORY_COLORS[principal] || "#8A8F87";
  }

  function pinSvg(color) {
    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36">
        <circle cx="18" cy="18" r="10.5" fill="${color}" stroke="#FFFFFF" stroke-width="3.5"/>
        <circle cx="18" cy="18" r="10.5" fill="none" stroke="#171A1A" stroke-width="1"/>
      </svg>`;
    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
  }

  function renderMarkers(filtrados) {
    markers.forEach(m => m.setMap(null));
    markers = [];

    filtrados.forEach(local => {
      if (!local.lat || !local.long) return;

      const color = colorPrincipal(local.categorias);
      const marker = new google.maps.Marker({
        position: { lat: parseFloat(local.lat), lng: parseFloat(local.long) },
        map: map,
        title: local.nombre,
        icon: {
          url: pinSvg(color),
          scaledSize: new google.maps.Size(34, 34),
          anchor: new google.maps.Point(17, 17)
        }
      });

      const infoWindow = sharedInfoWindow;
      marker.addListener("click", () => {
        infoWindow.setContent(armarInfoWindow(local));
        infoWindow.open(map, marker);
      });
      marker._localId = local.id;
      markers.push(marker);
    });
  }

  function tagsHtml(categorias) {
    return (categorias || []).map(cat => {
      const bg = CATEGORY_COLORS[cat] || "#8A8F87";
      const fg = CATEGORY_TEXT[cat] || "#FFFFFF";
      return `<span class="cat-tag" style="background:${bg};color:${fg};">${cat}</span>`;
    }).join("");
  }

  function armarInfoWindow(local) {
    const domingo = local.abre_domingo
      ? `<span class="badge-domingo si">✓ Abre domingos</span>`
      : `<span class="badge-domingo no">✕ No abre domingos</span>`;
    const insta = local.instagram ? `<p><a href="https://instagram.com/${local.instagram.replace('@','')}" target="_blank">${local.instagram}</a></p>` : "";
    const whatsapp = local.telefono_whatsapp ? `<p>📱 <a href="https://wa.me/54${local.telefono_whatsapp}" target="_blank">WhatsApp: ${local.telefono_whatsapp}</a></p>` : "";
    const fijo = local.telefono_fijo ? `<p>☎️ ${local.telefono_fijo}</p>` : "";

    return `
      <div class="iw">
        <div class="cat-tags">${tagsHtml(local.categorias)}</div>
        <h3>${local.nombre}</h3>
        <p>📍 ${local.direccion || ""}</p>
        <p>🕒 ${local.horario || "Horario no disponible"}</p>
        <p>${domingo}</p>
        ${whatsapp}
        ${fijo}
        ${insta}
        ${local.notas ? `<p style="margin-top:6px;font-style:italic;">${local.notas}</p>` : ""}
        ${local.lat && local.long ? `<button class="btn-ir" onclick="window.abrirRuta(${local.lat}, ${local.long})">🚴 Ir en bici</button>` : ""}
      </div>
    `;
  }

  function renderSheetList(filtrados) {
    const list = document.getElementById("sheet-list");
    list.innerHTML = "";

    filtrados.forEach(local => {
      const color = colorPrincipal(local.categorias);
      const card = document.createElement("div");
      card.className = "local-card";
      card.innerHTML = `
        <div class="marca" style="background:${color};"></div>
        <div class="info">
          <h3>${local.nombre}</h3>
          <div class="cat-tags">${tagsHtml(local.categorias)}</div>
          <div class="direccion">📍 ${local.direccion || ""}</div>
          ${local.abre_domingo
            ? '<span class="badge-domingo si">✓ Abre domingos</span>'
            : '<span class="badge-domingo no">✕ No abre domingos</span>'}
          ${local.lat && local.long ? `<div><button class="btn-ir" onclick="event.stopPropagation(); window.abrirRuta(${local.lat}, ${local.long})">🚴 Ir en bici</button></div>` : ""}
        </div>
      `;
      card.addEventListener("click", () => {
        if (local.lat && local.long) {
          map.panTo({ lat: parseFloat(local.lat), lng: parseFloat(local.long) });
          map.setZoom(16);
          const marker = markers.find(m => m._localId === local.id);
          if (marker) google.maps.event.trigger(marker, "click");
        }
        collapseSheet();
      });
      list.appendChild(card);
    });
  }

  // ---------- EVENTOS DE ÍCONOS DE CATEGORÍA ----------
  document.querySelectorAll(".chip-icon[data-cat]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".chip-icon[data-cat]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeCategory = btn.dataset.cat;
      render();
    });
  });

  document.getElementById("chip-domingo").addEventListener("click", (e) => {
    onlySunday = !onlySunday;
    e.currentTarget.classList.toggle("on", onlySunday);
    render();
  });

  // ---------- BOTTOM SHEET: drag + snap ----------
  const sheet = document.getElementById("sheet");
  const handleArea = document.getElementById("sheet-handle-area");

  function expandSheet() { sheet.classList.add("expanded"); }
  function collapseSheet() { sheet.classList.remove("expanded"); }

  function setupSheetDrag() {
    let startY = 0;
    let startTranslate = 0;
    let dragging = false;
    let history = []; // últimas posiciones {t, y} para calcular velocidad del gesto

    function getCurrentTranslateY() {
      const rect = sheet.getBoundingClientRect();
      return rect.top;
    }

    handleArea.addEventListener("click", () => {
      sheet.classList.toggle("expanded");
    });

    handleArea.addEventListener("pointerdown", (e) => {
      dragging = true;
      startY = e.clientY;
      startTranslate = getCurrentTranslateY();
      history = [{ t: performance.now(), y: e.clientY }];
      sheet.classList.add("dragging");
      handleArea.setPointerCapture(e.pointerId);
    });

    handleArea.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const deltaY = e.clientY - startY;
      const containerHeight = sheet.parentElement.getBoundingClientRect().height;
      const newTop = Math.max(containerHeight * 0.15, Math.min(containerHeight - 96, startTranslate + deltaY));
      sheet.style.transform = `translateY(${newTop - (containerHeight - sheet.offsetHeight)}px)`;

      history.push({ t: performance.now(), y: e.clientY });
      if (history.length > 6) history.shift();
    });

    handleArea.addEventListener("pointerup", (e) => {
      if (!dragging) return;
      dragging = false;
      sheet.classList.remove("dragging");
      sheet.style.transform = "";

      // Velocidad del gesto: comparamos el primer y último punto guardados
      let velocity = 0;
      if (history.length >= 2) {
        const first = history[0];
        const last = history[history.length - 1];
        const dt = last.t - first.t;
        if (dt > 0) velocity = (last.y - first.y) / dt; // px por ms, positivo = hacia abajo
      }

      const FLICK_THRESHOLD = 0.5; // px/ms — un gesto corto y rápido ya alcanza

      if (velocity > FLICK_THRESHOLD) {
        collapseSheet();
        return;
      }
      if (velocity < -FLICK_THRESHOLD) {
        expandSheet();
        return;
      }

      // Si no fue un flick claro, usamos la posición final como antes
      const rect = sheet.getBoundingClientRect();
      const containerRect = sheet.parentElement.getBoundingClientRect();
      const visibleRatio = (containerRect.bottom - rect.top) / rect.height;

      if (visibleRatio > 0.4) {
        expandSheet();
      } else {
        collapseSheet();
      }
    });
  }
</script>
